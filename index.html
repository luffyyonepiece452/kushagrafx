<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kushagrafx | Video Editor & 3D Motion Designer</title>
<meta name="description" content="2D/3D motion designer and video editor. Turning creative ideas into scroll-stopping visuals.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;900&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== CHANGE FONTS AND COLORS HERE ===== */
  :root {

    --text:#EDEEFF; --muted:#a9acd9; --accent:#A0A4ff; --glow:rgba(160,164,255,.35);
    --font-head:'Noto Sans',sans-serif; --font-body:'Mulish',sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:90px; }
  body { background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.6; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; z-index:-1; background:radial-gradient(ellipse at 50% 0%,var(--panel-2) 0%,var(--bg) 65%); }
  a { color:inherit; text-decoration:none; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .wrap { max-width:1300px; margin:0 auto; padding:0 5%; }
  section { padding:80px 0; }
  h2 { font-family:var(--font-head); font-weight:900; font-size:clamp(1.8rem,4vw,2.8rem); line-height:1.1; margin-bottom:12px; }

  .nav { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:50; display:flex; gap:4px; padding:7px; border-radius:50px; background:rgba(30,32,70,.55); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--glow); }

  .btn { display:inline-block; font-family:var(--font-head); font-weight:700; padding:13px 28px; border-radius:50px; background:var(--accent); color:#000; border:1px solid var(--accent); transition:all .25s; }

  .reel iframe { width:100%; height:100%; border:0; }

  /* PLACEHOLDER (empty video slot) */
  .ph { display:grid; place-items:center; text-align:center; color:var(--muted); font-size:.9rem; background:repeating-linear-gradient(135deg,var(--panel) 0 14px,#101128 14px 28px); cursor:default; }
  .ph b { display:block; width:54px; height:54px; margin:0 auto 10px; border-radius:50%; border:2px solid var(--glow); color:var(--accent); line-height:50px; font-size:1.2rem; }

  /* WORK */
  #work { padding-top:50px; }
  .work-head { margin-bottom:34px; }
  .work-head h2 { margin-bottom:8px; }

  .grid-port { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; margin-bottom:22px; }
  .card { position:relative; display:block; width:100%; border:1px solid var(--glow); border-radius:14px; overflow:hidden; background:var(--panel) center/cover no-repeat; cursor:pointer; text-align:left; color:inherit; font:inherit; transition:transform .3s,border-color .3s,box-shadow .3s; }
  .card.land { aspect-ratio:16/9; }
  .card.port { aspect-ratio:9/16; }
  .card.has::after { content:''; position:absolute; inset:0; background:linear-gradient(0deg,rgba(0,0,0,.88),rgba(0,0,0,0) 55%); }

  .card h4 { font-family:var(--font-head); font-size:1.05rem; }
  .card .meta span { color:var(--accent); font-size:.85rem; }
  .play { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2; width:56px; height:56px; border-radius:50%; background:rgba(20,21,46,.65); border:2px solid var(--accent); color:var(--accent); display:grid; place-items:center; padding-left:4px; transition:all .25s; }
  .card:hover .play { background:var(--accent); color:#000; }

  /* VIDEO MODAL */
  .modal { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.88); display:none; place-items:center; padding:20px; }
  .modal.open { display:grid; }
  .modal-box { width:min(960px,100%); aspect-ratio:16/9; position:relative; }
  .modal-box.vert { width:min(360px,90vw); aspect-ratio:9/16; max-height:88vh; }
  .modal iframe { width:100%; height:100%; border:0; border-radius:12px; background:#000; }
  .close { position:absolute; top:-44px; right:0; background:none; border:1px solid var(--accent); color:var(--accent); border-radius:50px; padding:6px 16px; font:700 .85rem var(--font-head); cursor:pointer; }

  .about-row { display:grid; grid-template-columns:1.1fr 1fr; gap:56px; align-items:start; }
  .tag { font-family:var(--font-head); font-weight:700; font-size:.95rem; letter-spacing:2px; color:var(--accent); margin-bottom:14px; }
  .about-row h2 { margin-bottom:18px; }
  .about-row p { margin-bottom:16px; max-width:600px; }
  .tools { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .tool { display:flex; flex-direction:column; align-items:center; gap:12px; padding:22px 10px; background:rgba(30,32,70,.5); border:1px solid var(--glow); border-radius:16px; text-align:center; transition:all .25s; }
  .tool:hover { border-color:var(--accent); transform:translateY(-4px); }
  .tool svg,.tool img { width:56px; height:56px; }
  .tool span { font-weight:700; font-size:.9rem; }

  /* FEEDBACK */
  .slider { display:flex; gap:22px; overflow-x:auto; scroll-snap-type:x mandatory; padding:8px 5vw 24px; margin:0 -5vw; scrollbar-width:thin; scrollbar-color:var(--glow) transparent; }
